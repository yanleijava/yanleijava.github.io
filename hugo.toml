baseURL = 'https://yanleijava.github.io/'
title = '超神投资'
theme = 'mifanr'
locale = 'zh-CN'
defaultContentLanguage = 'zh-hans'
hasCJKLanguage = true
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true
summaryLength = 90
disableKinds = ['taxonomy', 'term']

[pagination]
  pagerSize = 50

# 正文里的 date 优先。日报文件名是 YYYY-MM-DD.md 时，没写 date 也会用文件名。
[frontmatter]
  date = ['date', ':filename', ':fileModTime', ':default']

[outputs]
  home = ['HTML', 'RSS']

[outputFormats.RSS]
  mediaType = 'application/rss+xml'
  baseName = 'rss'

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.highlight]
  style = 'github'
  noClasses = true
  tabWidth = 2

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  description = '计划你的交易，交易你的计划。'
  github = 'yanleijava'
  twitter = 'chaoshentouzi'
  dateFormat = '2006 年 1 月 2 日'
  avatar = '/images/avatar.jpg'
  license = 'CC BY 4.0'
  licenseURL = 'https://creativecommons.org/licenses/by/4.0/deed.zh'

[[params.products]]
  name = 'ETH 10000'
  url = 'https://eth10000.com/'
  summary = '以太坊投资研究：公开策略信号、历史表现与数据。'
  note = '在线'
  logo = '/images/products/eth10000.svg'

