<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>超神</title>
    <meta name="description" content="计划你的交易，交易你的计划。">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/site.css">
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="home">
    <div class="page">
      <header class="site-header">
        <a class="brand" href="/">
          <img class="avatar" src="/assets/avatar.jpg" alt="" width="32" height="32">
          <span>超神</span>
        </a>
        <button class="theme-toggle" type="button" aria-label="切换颜色">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </header>
      <main>
        <p class="lead">你好，我是超神。</p>
        <p>计划你的交易，交易你的计划。每天的市场记录放在 <a href="https://news.chaoshen.io/">资讯</a>，想留下来的文章放在 <a href="https://blog.chaoshen.io/">博客</a>。</p>
        <p>也做了几个小东西：<a href="https://eth10000.com/">ETH 10000</a>、<a href="https://blog.chaoshen.io/mbti/">MBTI 16 型人格测试</a>、<a href="https://blog.chaoshen.io/mbti-kids/">小朋友图画偏好</a>，还有一份 <a href="https://blog.chaoshen.io/wufan/">公开推文画像</a>。</p>
        <p>想打招呼的话，可以在 <a href="https://x.com/chaoshentouzi">X</a> 或 <a href="https://github.com/yanleijava">GitHub</a> 找到我。</p>
      </main>
    </div>
    <script>
      document.querySelector(".theme-toggle").addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    </script>
  </body>
</html>
