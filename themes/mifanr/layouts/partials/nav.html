<nav class="nav-wrap" aria-label="站点导航">
  <div class="nav">
    <a class="{{ if .IsHome }}active{{ end }}" href="{{ `/` | relURL }}">首页</a>
    <a class="{{ if or (eq .Section `posts`) (eq .RelPermalink (`posts/` | relURL)) }}active{{ end }}" href="{{ `posts/` | relURL }}">文章</a>
    {{- $dailyTerm := site.GetPage "/categories/日报" -}}
    <a class="{{ if and $dailyTerm (eq .RelPermalink $dailyTerm.RelPermalink) }}active{{ end }}" href="{{ if $dailyTerm }}{{ $dailyTerm.RelPermalink }}{{ else }}{{ `categories/日报/` | relURL }}{{ end }}">日报</a>
    <a class="{{ if eq .RelPermalink (`works/` | relURL) }}active{{ end }}" href="{{ `works/` | relURL }}">作品</a>
    <a class="{{ if eq .RelPermalink (`about/` | relURL) }}active{{ end }}" href="{{ `about/` | relURL }}">关于</a>
  </div>
</nav>
